<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شذى الأثير — طلب صيانة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --brown: #9B3D2B; --brown-dark: #7A2E1E;
  --cream: #F0EAD6; --cream-dark: #E2D8C0; --cream-darker: #C9BC9F;
  --text-dark: #2C1A14; --text-mid: #6B4035; --text-light: #9B7060;
  --white: #FFFDF8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Tajawal', sans-serif; direction: rtl; background: var(--brown); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.card { background: var(--white); border-radius: 16px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 20px 60px rgba(44,26,20,0.3); }
.card-header { background: var(--brown); padding: 2rem 1.75rem 1.75rem; text-align: center; }
.logo-mark { width: 56px; height: 56px; background: var(--cream); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 24px; font-weight: 700; color: var(--brown); }
.card-header h1 { font-size: 20px; font-weight: 700; color: var(--cream); }
.card-header p { font-size: 13px; color: var(--cream-darker); margin-top: 5px; }
.card-body { padding: 1.75rem; }
.step { display: none; }
.step.active { display: block; }
.field { margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--text-mid); display: block; margin-bottom: 6px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--cream-dark); border-radius: 9px; font-size: 14px; background: var(--white); color: var(--text-dark); font-family: 'Tajawal', sans-serif; transition: border-color 0.15s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brown); }
.field textarea { resize: none; height: 90px; }
.btn { width: 100%; padding: 13px; background: var(--brown); color: var(--cream); border: none; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Tajawal', sans-serif; transition: background 0.15s; }
.btn:hover { background: var(--brown-dark); }
.btn:disabled { background: var(--cream-darker); cursor: not-allowed; }
.error-box { font-size: 13px; color: #7A2E1E; background: #F5D5CF; padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; display: none; }
.hint { font-size: 13px; color: var(--text-mid); text-align: center; margin-bottom: 16px; line-height: 1.7; }
.hint strong { color: var(--text-dark); font-weight: 700; }
.otp-input { width: 100%; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 12px; padding: 14px; border: 1.5px solid var(--cream-dark); border-radius: 9px; background: var(--white); font-family: 'Tajawal', sans-serif; color: var(--text-dark); margin-bottom: 14px; }
.otp-input:focus { outline: none; border-color: var(--brown); }
.resend-row { text-align: center; margin-top: 12px; font-size: 13px; color: var(--text-light); }
.resend-row span { color: var(--brown); cursor: pointer; font-weight: 700; }
.success-wrap { text-align: center; padding: 1rem 0; }
.success-circle { width: 72px; height: 72px; background: var(--cream); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; font-size: 32px; }
.success-wrap h2 { font-size: 20px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
.success-wrap p { font-size: 14px; color: var(--text-mid); line-height: 1.7; margin-bottom: 1.5rem; }
.divider { height: 1px; background: var(--cream-dark); margin: 1.25rem 0; }
.back-row { text-align: center; margin-top: 12px; font-size: 13px; color: var(--text-light); }
.back-row a { color: var(--brown); font-weight: 700; text-decoration: none; }
.loading-text { text-align: center; color: var(--text-mid); font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo-mark">ش</div>
    <h1>إدارة أملاك شذى الأثير</h1>
    <p>بوابة طلبات الصيانة</p>
  </div>
  <div class="card-body">

    <div id="step1" class="step active">
      <div class="field"><label>رقم الشقة</label><input id="tUnit" type="text" placeholder="مثال: 003" maxlength="3"></div>
      <div class="field"><label>رقم جوالك المسجل</label><input id="tPhone" type="tel" placeholder="05xxxxxxxx"></div>
      <div id="err1" class="error-box"></div>
      <button class="btn" id="sendBtn">إرسال رمز التحقق</button>
      <div class="back-row"><a href="index.html">→ الرجوع للرئيسية</a></div>
    </div>

    <div id="step2" class="step">
      <p class="hint">أرسلنا رمز التحقق على رقم<br><strong id="maskedPhone"></strong></p>
      <input class="otp-input" id="tOtp" type="text" placeholder="· · · ·" maxlength="6">
      <div id="err2" class="error-box"></div>
      <button class="btn" id="verifyBtn">تحقق</button>
      <div class="resend-row">لم يصلك الرمز؟ <span id="resendBtn">إعادة الإرسال</span></div>
    </div>

    <div id="step3" class="step">
      <div class="field"><label>نوع المشكلة</label>
        <select id="tType">
          <option value="">اختر نوع المشكلة...</option>
          <option>سباكة</option>
          <option>كهرباء</option>
          <option>تكييف</option>
          <option>أبواب ونوافذ</option>
          <option>أخرى</option>
        </select>
      </div>
      <div class="field"><label>وصف المشكلة</label><textarea id="tDesc" placeholder="اشرح المشكلة بالتفصيل..."></textarea></div>
      <div id="err3" class="error-box"></div>
      <button class="btn" id="submitBtn">إرسال الطلب</button>
    </div>

    <div id="step4" class="step">
      <div class="success-wrap">
        <div class="success-circle">✓</div>
        <h2>تم إرسال طلبك</h2>
        <p>وصل طلبك للمالك وسيتم التواصل معك قريباً</p>
        <button class="btn" id="resetBtn">إرسال طلب آخر</button>
        <div class="back-row"><a href="index.html">→ الرجوع للرئيسية</a></div>
      </div>
    </div>

  </div>
</div>

<script>
var SUPABASE_URL = 'https://nzlqgqsnimfjvhpgpdjv.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56bHFncXNuaW1manZocGdwZGp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzM2ODIsImV4cCI6MjA5MzMwOTY4Mn0.0orAgXL_rJ1enSMN6yMK_CfGqdkQ70NPD9qHcQW3gnM';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var currentTenant = null;
var currentPhone = null;

function showStep(n) {
  var steps = document.querySelectorAll('.step');
  for (var i = 0; i < steps.length; i++) { steps[i].classList.remove('active'); }
  document.getElementById('step' + n).classList.add('active');
}

function showError(id, msg) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}

function hideErrors() {
  var errors = document.querySelectorAll('.error-box');
  for (var i = 0; i < errors.length; i++) { errors[i].style.display = 'none'; }
}

function formatPhone(phone) {
  var p = phone.trim();
  if (p.startsWith('05')) { return '+966' + p.slice(1); }
  if (p.startsWith('5')) { return '+966' + p; }
  if (p.startsWith('+')) { return p; }
  return '+966' + p;
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('sendBtn').addEventListener('click', doVerify);
  document.getElementById('verifyBtn').addEventListener('click', doOtp);
  document.getElementById('resendBtn').addEventListener('click', doVerify);
  document.getElementById('submitBtn').addEventListener('click', doSubmit);
  document.getElementById('resetBtn').addEventListener('click', doReset);
});

async function doVerify() {
  hideErrors();
  var unit = document.getElementById('tUnit').value.trim().padStart(3,'0');
  var phone = document.getElementById('tPhone').value.trim();
  if (!unit || !phone) { showError('err1', 'يرجى ملء جميع الحقول'); return; }

  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';

  var result = await sb.from('units').select('*').eq('unit_number', unit).eq('tenant_phone', phone).eq('status','occupied');
  if (!result.data || result.data.length === 0) {
    showError('err1', 'رقم الشقة أو الجوال غير صحيح');
    btn.disabled = false;
    btn.textContent = 'إرسال رمز التحقق';
    return;
  }
  currentTenant = result.data[0];
  currentPhone = formatPhone(phone);

  var response = await fetch('/api/send-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: currentPhone, action: 'send' })
  });
  var data = await response.json();

  btn.disabled = false;
  btn.textContent = 'إرسال رمز التحقق';

  if (data.status === 'pending' || data.status === 'approved') {
    var masked = phone.slice(0,4) + '****' + phone.slice(-2);
    document.getElementById('maskedPhone').textContent = masked;
    document.getElementById('tOtp').value = '';
    showStep(2);
  } else {
    showError('err1', 'حدث خطأ أثناء الإرسال، حاول مرة ثانية');
  }
}

async function doOtp() {
  hideErrors();
  var code = document.getElementById('tOtp').value.trim();
  if (!code) { showError('err2', 'يرجى إدخال الرمز'); return; }

  var btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = 'جاري التحقق...';

  var response = await fetch('/api/send-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: currentPhone, action: 'verify', code: code })
  });
  var data = await response.json();

  btn.disabled = false;
  btn.textContent = 'تحقق';

  if (data.valid) {
    showStep(3);
  } else {
    showError('err2', 'الرمز غير صحيح، حاول مرة ثانية');
  }
}

async function doSubmit() {
  hideErrors();
  var type = document.getElementById('tType').value;
  var desc = document.getElementById('tDesc').value.trim();
  if (!type || !desc) { showError('err3', 'يرجى ملء جميع الحقول'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';

  await sb.from('maintenance_requests').insert({ unit_id: currentTenant.id, issue_type: type, description: desc, status: 'open' });

  btn.disabled = false;
  btn.textContent = 'إرسال الطلب';
  showStep(4);
}

function doReset() {
  currentTenant = null;
  currentPhone = null;
  document.getElementById('tUnit').value = '';
  document.getElementById('tPhone').value = '';
  document.getElementById('tOtp').value = '';
  document.getElementById('tType').value = '';
  document.getElementById('tDesc').value = '';
  hideErrors();
  showStep(1);
}
</script>
</body>
</html>
